[project]
name = "django-sns-view"
version = "1.0.1+sl.1"
description = "A Django view that can be subscribed to Amazon SNS"
authors = [
    { name = "thelab", email = "thelabdev@thelab.co" },
    { name = "deep-c", email = "deepteshchagan@gmail.com" },
]
license = { text = "ISC" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django (>=4.2)",
    "cryptography (>=44.0.2)",
    "requests (>=2.32.3)",
    "pydantic (>=2.10.6,<3.0.0)",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.11.0",
    "coverage>=7.6.12",
    "django-stubs>=5.1.3",
    "types-cryptography>=3.3.23.2",
    "types-requests>=2.32.0.20250306",
    "tox>=4.24.2",
    "poethepoet>=0.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poe.tasks]
lint = "ruff check django_sns_view"
format = "ruff format --diff django_sns_view"
typecheck = "mypy django_sns_view"
test = "coverage run manage.py test django_sns_view -v 2 --buffer"
coverage = ["test", "coverage report"]
check = ["lint", "format", "typecheck", "test"]

[tool.isort]
profile = "black"
from_first = true

[tool.ruff.lint.isort]
from-first = true

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]

# Strict mode, see mypy --help
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
show_error_codes = true
# Not turned on by strict
strict_equality = true

[tool.django-stubs]
django_settings_module = "django_sns_view.tests.settings"

[tool.coverage.run]
branch = true
source_pkgs = ["django_sns_view"]
omit = ["*/django_sns_view/tests/*"]

[tool.coverage.report]
show_missing = true
ignore_errors = true
