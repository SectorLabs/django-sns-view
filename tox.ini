[tox]
isolated_build = True
toxworkdir={env:TOX_WORK_DIR:.tox}
envlist = py{312,313}-django{420,500,510}

[testenv]
allowlist_externals =
    uv
deps =
    django420: django>=4.2,<4.3
    django500: django>=5.0,<5.1
    django510: django>=5.1,<5.2
setenv =
    PYTHONWARNINGS = d
# Install dev dependencies using uv, excluding Django (already installed by tox)
commands_pre =
    uv pip install mypy ruff coverage django-stubs types-cryptography types-requests pydantic cryptography requests
commands =
    ruff check {toxinidir}/django_sns_view
    ruff format --diff {toxinidir}/django_sns_view
    mypy {toxinidir}/django_sns_view
    {envpython} -m coverage run \
        {toxinidir}/manage.py test \
            django_sns_view \
            -v 2 \
            --buffer
    coverage report
    coverage xml